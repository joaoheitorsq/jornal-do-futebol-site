name: Jornal do Futebol

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - jornal.py
      - channels.json
      - ports_channels.json
      - assets/**
      - templates/**
      - tests/**
      - .github/workflows/jornal.yml
      - manifest.webmanifest
      - service-worker.js

concurrency:
  group: jornal-do-futebol-pages
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

env:
  ARGOS_PACKAGE_DIR: ${{ github.workspace }}/.argos-packages
  ARGOS_DEVICE_TYPE: cpu
  ARGOS_INTRA_THREADS: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:

  build:

    name: Gerar Jornal

    runs-on: ubuntu-24.04

    steps:

      - name: Baixar repositório
        uses: actions/checkout@v7

      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Validar código-fonte
        run: |
          python -m py_compile jornal.py tests/validate_site.py
          for file in assets/*.js; do
            node --check "$file"
          done
          node tests/runtime_playback.cjs
          node tests/service_worker_cache.cjs
          python tests/validate_site.py --source-only

      - name: Restaurar cache do tradutor
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            .argos-packages
          key: ${{ runner.os }}-py312-argos-1.11.0-en-pt-v1

      - name: Restaurar metadados de canais
        uses: actions/cache@v4
        with:
          path: channel_metadata_cache.json
          key: ${{ runner.os }}-youtube-channel-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-youtube-channel-

      - name: Preparar tradução local
        # Uma falha da instalação opcional não deve bloquear novas edições.
        continue-on-error: true
        timeout-minutes: 7
        run: |
          python -m pip install --quiet --retries 1 --timeout 15 argostranslate==1.11.0

      - name: Executar Jornal do Futebol
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python jornal.py

      - name: Validar site gerado
        run: |
          python tests/validate_site.py

      - name: Testar interface real em Chromium
        if: github.event_name == 'push'
        timeout-minutes: 9
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.57.0
          npx playwright install chromium
          node tests/browser_smoke.cjs

      - name: Preparar arquivos do site
        run: |
          mkdir -p _site/assets
          cp index.html revision.json _site/
          cp assets/*.js _site/assets/
          cp assets/style.css _site/assets/style.css
          cp assets/icon.svg assets/icon-192.png assets/icon-512.png _site/assets/
          cp manifest.webmanifest service-worker.js _site/

          if [ -f hearthpwn_translation_cache.json ]; then
            cp hearthpwn_translation_cache.json _site/hearthpwn_translation_cache.json
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar site para o GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          # Nomes independentes por tentativa evitam a colisão de artefatos
          # ao usar "Re-run all jobs" no mesmo workflow run.
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: ./_site

  deploy:

    name: Publicar Jornal

    runs-on: ubuntu-24.04

    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Selecionar artefato da última geração bem-sucedida
        id: pages_artifact
        uses: actions/github-script@v7
        with:
          script: |
            // No re-run apenas do deploy, a geração anterior pode ser
            // reaproveitada. Selecionar por ID evita confundir tentativas.
            const prefix = `github-pages-${context.runId}-`;
            const {data} = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
              per_page: 100
            });
            const artifacts = data.artifacts
              .filter(item => !item.expired && item.name.startsWith(prefix))
              .sort((a, b) => b.id - a.id);
            if (!artifacts.length) {
              throw new Error('Nenhum artefato Pages válido encontrado nesta execução.');
            }
            core.info(`Publicando artefato ${artifacts[0].name} (ID ${artifacts[0].id}).`);
            core.setOutput('name', artifacts[0].name);

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ steps.pages_artifact.outputs.name }}
