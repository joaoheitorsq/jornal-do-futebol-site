name: Jornal do Futebol

on:
  # Permite executar manualmente para testes.
  workflow_dispatch:

  schedule:
    # Executa duas vezes por hora:
    # xx:07 e xx:37.
    #
    # Evitamos 00 e 30 porque horários "redondos"
    # tendem a concentrar mais workflows.
    - cron: '7,37 * * * *'
      timezone: 'America/Fortaleza'

    # Heartbeat mensal.
    #
    # Repositórios públicos podem ter workflows
    # agendados desativados depois de 60 dias
    # sem atividade no repositório.
    #
    # Esta execução cria um pequeno commit
    # mensal para manter o projeto ativo.
    - cron: '17 3 1 * *'
      timezone: 'America/Fortaleza'


# Evita dois deploys do site acontecendo
# simultaneamente.
concurrency:
  group: jornal-do-futebol-pages
  cancel-in-progress: false


# Permissões padrão.
permissions:
  contents: read
  pages: write
  id-token: write


jobs:

  # ======================================================
  # GERA O JORNAL
  # ======================================================

  build:

    name: Gerar Jornal

    runs-on: ubuntu-latest

    steps:

      - name: Baixar repositório
        uses: actions/checkout@v7


      - name: Preparar Python
        uses: actions/setup-python@v7

        with:
          python-version: '3.13'


      - name: Executar Jornal do Futebol

        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

        run: |
          python jornal.py


      - name: Preparar arquivos do site

        run: |
          mkdir -p _site
          cp index.html _site/index.html


      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5


      - name: Enviar site para o GitHub Pages
        uses: actions/upload-pages-artifact@v4

        with:
          path: ./_site


  # ======================================================
  # PUBLICA O SITE
  # ======================================================

  deploy:

    name: Publicar Jornal

    runs-on: ubuntu-latest

    needs: build

    environment:

      name: github-pages

      url: ${{ steps.deployment.outputs.page_url }}


    steps:

      - name: Publicar no GitHub Pages

        id: deployment

        uses: actions/deploy-pages@v4


  # ======================================================
  # HEARTBEAT MENSAL
  # ======================================================

  heartbeat:

    name: Manter automação ativa

    if: >
      github.event_name == 'schedule' &&
      github.event.schedule == '17 3 1 * *'

    runs-on: ubuntu-latest


    # Este job precisa conseguir criar um commit.
    permissions:
      contents: write


    steps:

      - name: Baixar repositório
        uses: actions/checkout@v7


      - name: Registrar atividade mensal

        run: |

          date -u +"%Y-%m-%dT%H:%M:%SZ" > .heartbeat

          git config user.name "github-actions[bot]"

          git config user.email \
          "41898282+github-actions[bot]@users.noreply.github.com"

          git add .heartbeat

          git commit \
          -m "Manter automação ativa" \
          || exit 0

          git push
