name: Jornal do Futebol

on:
  workflow_dispatch:

concurrency:
  group: jornal-do-futebol-pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:

  build:

    name: Gerar Jornal

    runs-on: ubuntu-latest

    steps:

      - name: Baixar repositório
        uses: actions/checkout@v7

      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Executar Jornal do Futebol
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python jornal.py

      - name: Preparar arquivos do site
        run: |
          mkdir -p _site
          cp index.html _site/index.html

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar site para o GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site


  deploy:

    name: Publicar Jornal

    runs-on: ubuntu-latest

    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
