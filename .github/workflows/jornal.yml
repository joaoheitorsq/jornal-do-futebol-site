name: Jornal do Futebol

on:
  workflow_dispatch:

concurrency:
  group: jornal-do-futebol-pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

env:
  ARGOS_PACKAGE_DIR: ${{ github.workspace }}/.argos-packages
  ARGOS_DEVICE_TYPE: cpu
  ARGOS_INTRA_THREADS: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:

  build:

    name: Gerar Jornal

    runs-on: ubuntu-latest

    steps:

      - name: Baixar repositório
        uses: actions/checkout@v7

      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Restaurar cache do tradutor
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            .argos-packages
          key: ${{ runner.os }}-py312-argos-1.11.0-en-pt-v1

      - name: Preparar tradução local
        continue-on-error: true
        run: |
          python -m pip install --quiet argostranslate==1.11.0

      - name: Executar Jornal do Futebol
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python jornal.py

      - name: Preparar arquivos do site
        run: |
          mkdir -p _site
          cp index.html _site/index.html

          if [ -f hearthpwn_translation_cache.json ]; then
            cp hearthpwn_translation_cache.json _site/hearthpwn_translation_cache.json
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar site para o GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:

    name: Publicar Jornal

    runs-on: ubuntu-latest

    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
